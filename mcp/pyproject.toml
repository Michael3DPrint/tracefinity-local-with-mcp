[project]
name = "tracefinity-mcp"
version = "0.1.0"
description = "Local MCP wrapper for a self-hosted Tracefinity instance"
requires-python = ">=3.10"
# mcp pinned <2: this code targets the v1 FastMCP API
# (mcp.server.fastmcp.FastMCP). mcp 2.x renamed it to MCPServer and changed
# other APIs — see https://py.sdk.modelcontextprotocol.io/v2/migration/
dependencies = [
    "mcp[cli]>=1.2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
tracefinity-mcp = "tracefinity_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracefinity_mcp"]
